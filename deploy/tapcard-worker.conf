; Supervisor config for the TapCard / Card Setu Laravel queue worker.
; Required in production because some notifications are dispatched to the queue
; (QUEUE_CONNECTION=database) and will not send unless a worker is running.
;
; Install:
;   sudo cp deploy/tapcard-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start tapcard-worker:*
;
; Adjust `command` paths, `user`, and `numprocs` for your server.

[program:tapcard-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/tapcard/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=3600
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/tapcard/backend/storage/logs/worker.log
stopasgroup=true
